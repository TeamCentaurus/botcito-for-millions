[project]
name = "botcito-para-ganar-millones"
version = "0.1.0"
description = "Botcito para ganar dineros"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    { name = "Leonel Aliaga", email = "leonel.aliaga.v@gmail.com"},
    { name = "Rainier Moreno", email = "rmorenocueva@gmail.com"}
    ]

dependencies = [
    "joblib>=1.5.3",
    "numpy>=2.3.5",
    "pandas>=2.3.3",
    "pykalman>=0.11.2",
    "pyspark>=4.0.1",
    "requests>=2.32.5",
    "statsmodels>=0.14.6",
    "twelvedata==1.2.25",
    "yfinance>=0.2.66",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "matplotlib>=3.10.8",
    "plotly>=7.1.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
    "streamlit>=1.65.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = [
    "spec: test que cierra un criterio de aceptación de un spec (docs/specs/)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["botcito_core", "synthetic"]
